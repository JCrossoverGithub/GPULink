function confirmOp(title,msg,fn){confirmAction=fn;by('confirmTitle').textContent=title;by('confirmText').textContent=msg;by('confirm').showModal();by('confirmNo').focus();}
function addEvent(title,detail,kind,color,target,ref){data.events.unshift({id:'e'+Date.now()+'-'+data.events.length,title,detail,kind,color,age:'now',target,ref});}
function setScenario(s){scenario=s;data=makeScenario(s);query='';filter='all';updated='just now';if(selected)closeDetail();render();toast('Loaded simulated scenario. No live systems changed.');}
function act(a){if(a==='close'){closeDetail();return}if(a==='reset'){setScenario(scenario);return}if(!selected||data.stale)return;let {type,id}=selected;
if(a==='toggle-drain'){let w=worker(id),next=!w.drain;confirmOp(next?'Drain '+w.name+'?':'Resume '+w.name+'?',next?'Simulation only. New placements will be blocked; current allocations remain unchanged.':'Simulation only. New placements may be considered by Core; existing holds are unchanged.',()=>{w.drain=next;addEvent(next?'Worker drained':'Worker resumed',w.name,'server',next?'amber':'green','worker',id);toast('Simulated worker mode updated.');render();openDetail(type,id,false);});}
if(a==='cancel-job'){let j=job(id);confirmOp('Cancel '+j.id+'?','Simulation only. A running job becomes cancelled and a known cleanup hold is created. This does not prove the process has stopped.',()=>{if(j.status==='running'){data.holds.push({id:'hold-'+Date.now(),w:j.w,g:j.g,job:j.id,epoch:1});}else{j.w=null;j.g=null;}j.status='cancelled';j.age='now';addEvent('Job cancelled',j.id,'jobs','amber','job',id);toast('Simulated job cancellation recorded.');render();openDetail(type,id,false);});}
if(a==='close-session'){let s=session(id);confirmOp('Close '+s.id+'?','Simulation only. The session will be marked closed. No actual stream or connection will be terminated.',()=>{s.status='closed';s.age='now';addEvent('Session closed',s.id,'sessions','gray','session',id);toast('Simulated session closed.');render();openDetail(type,id,false);});}}
function go(p){if(!navs.some(n=>n[0]===p))return;page=p;query='';filter='all';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tree!==undefined){treeOpen=!treeOpen;render();(treeOpen?by('treeClose'):(by('treeToggle')||document.querySelector('#nav [aria-current=page]')||by('mobileNav')))?.focus();return}if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.detail){let [t,id]=b.dataset.detail.split(':');openDetail(t,id);return}if(b.dataset.mode){topMode=b.dataset.mode;render();document.querySelector(`[data-mode="${topMode}"]`)?.focus();return}if(b.dataset.act)act(b.dataset.act);});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;render(true)}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='mobileNav')go(e.target.value);if(e.target.id==='scenario')setScenario(e.target.value);});
by('brandIcon').innerHTML=I('logo');by('closeDrawer').innerHTML=I('close');by('closeDrawer').onclick=closeDetail;by('overlay').onclick=e=>{if(e.target===by('overlay'))closeDetail()};by('refresh').onclick=()=>{if(data.stale){toast('Connection is simulated as lost. Snapshot remains stale.');return}updated='just now';render();toast('Simulated snapshot refreshed.');};by('confirmNo').onclick=()=>{confirmAction=null;by('confirm').close()};by('confirmYes').onclick=()=>{let fn=confirmAction;confirmAction=null;by('confirm').close();fn?.()};by('confirm').addEventListener('cancel',()=>confirmAction=null);
document.addEventListener('keydown',e=>{if(by('confirm').open)return;if(e.key==='Escape'&&selected)closeDetail();});

const design = 'C';
let focusGpu='g1';
const byState=s=>color(s[1]);
function summaryCounts(){let gs=gpus();return {gs,n:gs.length,online:data.workers.filter(w=>w.status==='online').length,un:gs.filter(g=>gpuState(g)[0]==='Unallocated').length,allocated:gs.filter(g=>gpuState(g)[0]==='Allocated').length,active:data.jobs.filter(activeJob).length+data.sessions.filter(activeSession).length,queued:data.jobs.filter(j=>j.status==='queued').length};}
const live=v=>data.stale?'—':v;
const simple=(text,p)=>`<button class="simple-action" data-page="${p}">${text} ${I('arrow')}</button>`;
const switches=()=>`<div class="map-switch" aria-label="Device view">${[['rack','Rack'],['table','Table'],['topology','Topology']].map(([v,n])=>`<button class="${topMode===v?'active':''}" data-mode="${v}" aria-pressed="${topMode===v}">${n}</button>`).join('')}</div>`;
const gpuTable=gs=>table(['Device / worker','Allocation','Util.','VRAM','Workload'],gpuRows(gs),'No devices registered');
function workRows(){return [...data.jobs.filter(j=>activeJob(j)||j.status==='queued').map(j=>({...j,kind:'job'})),...data.sessions.filter(activeSession).map(s=>({...s,kind:'session'}))].map(j=>[link(j.type.replace('external.batch.',''),j.kind,j.id,j.project),S(data.stale?'Last known: '+j.status:j.status,data.stale?'gray':undefined),j.w?esc(Wname(j.w)):'—',esc(j.age)]);}
function workTable(){return table(['Workload / project','State','Worker','Age'],workRows(),'No active or queued workloads');}
function summaryline(c){const item=(name,num,sub)=>`<div><label>${name}</label><strong>${num}</strong><small>${sub}</small></div>`;return `<div class="summaryline">${item('Physical GPUs',c.n,`${data.workers.length} registered workers`)}${item('Unallocated',live(c.un),data.stale?'Current state unknown':`${c.allocated} allocated · ${c.n-c.un-c.allocated} restricted`)}${item('Active workloads',live(c.active),data.stale?'Current state unknown':`${c.queued} batch jobs queued`)}${item('Known job holds',live(data.holds.length),data.stale?'Freshness unknown':data.holds.length?'Placement blocked':'No recorded job holds')}</div>`;}
function aOverview(){let c=summaryCounts();let issues=data.stale?`<div class="a-issue"><h3>Snapshot unavailable</h3><p>Current states cannot be verified.</p></div>`:data.holds.map(h=>`<div class="a-issue"><span class="section-index">01 / RECOVERY</span><h3>${esc(G(h.g)?.name)} · cleanup hold</h3><p>${esc(Wname(h.w))} · cancelled work remains fenced.</p><button class="simple-action" data-detail="hold:${h.id}">Inspect recovery record ${I('arrow')}</button></div>`).join('')+data.workers.filter(w=>w.status==='offline').map(w=>`<div class="a-issue"><span class="section-index">02 / CONNECTIVITY</span><h3>${esc(w.name)} offline</h3><p>Last heartbeat ${w.age}s ago. Telemetry is unavailable.</p><button class="simple-action" data-detail="worker:${w.id}">Inspect worker ${I('arrow')}</button></div>`).join('');return summaryline(c)+`<div class="a-main"><div>${panel('Physical infrastructure','Individual devices, not pooled memory.',topMode==='table'?gpuTable(c.gs):topology(),switches(),'Unallocated does not establish eligibility for a particular request.')}<div class="a-bottom">${panel('Execution in progress','Batch and streaming work with current placement.',workTable(),simple('All jobs','Jobs'))}</div></div><aside class="a-side"><div><div class="ruler"><h2>Needs attention</h2><span>${data.stale?'UNKNOWN':String(data.holds.length+data.workers.filter(w=>w.status==='offline').length).padStart(2,'0')}</span></div>${issues||'<div class="a-issue"><p>No known recovery or connectivity issues.</p></div>'}</div><div class="compact-events"><div class="ruler"><h2>Activity</h2>${simple('All events','Events')}</div>${eventList(data.events.slice(0,5))}</div></aside></div>`;}
function bInspector(){let g=G(focusGpu)||gpus()[0];if(!g)return `<div class="b-inspector"><div class="b-toolbar"><h2>Inspector</h2></div>${empty('No selection','Enroll a worker to inspect a GPU.')}</div>`;focusGpu=g.id;let w=worker(g.w),a=allocation(g),h=knownHold(g);return `<aside class="b-inspector"><div class="b-toolbar"><h2>Inspector</h2><span class="section-index">GPU ${String(g.index).padStart(2,'0')}</span></div><div class="body"><span class="section-index">${esc(w.name)} / DEVICE</span><h3>${esc(g.name)}</h3>${pair(gpuState(g))}<h4>Telemetry</h4>${details([['VRAM',staleGpu(g)?'Unknown':gb(g.used)+' / '+gb(g.vram)],['Utilization',staleGpu(g)?'Unknown':g.util+'%'],['Temperature',staleGpu(g)?'Unknown':g.temp+' °C'],['Power',staleGpu(g)?'Unknown':g.power+' W']])}<h4>${data.stale?'Last known allocation':'Allocation'}</h4>${a?related(a.id,a.id.startsWith('job')?'job':'session',a.id):'<p class="sub">No active allocation recorded.</p>'}${h?`<div class="callout">Known cleanup hold blocks new placement.</div>${related('Inspect hold','hold',h.id)}`:''}<h4>Worker</h4>${related(w.name,'worker',w.id)}<button class="inspect-action" data-detail="gpu:${g.id}">Full device record ${I('arrow')}</button></div></aside>`;}
function bMap(){if(!data.workers.length)return empty('No enrolled workers','Topology will appear when a worker registers.');return `<div class="b-nodes"><div class="b-root"><button data-detail="control:cp"><span class="section-index">CONTROL / 01</span><b>${I('network')} Control plane</b><small>${data.stale?'Connection lost':'Ready · simulation'}</small></button></div><svg class="b-wire" viewBox="0 0 400 39" preserveAspectRatio="none" aria-hidden="true"><path d="M200 0 V39" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><div class="b-hosts">${data.workers.map((w,i)=>`<section class="b-host ${w.status==='offline'?'offline':''}"><button data-detail="worker:${w.id}">${I('server')}<b>${esc(w.name)}</b>${pair(workerState(w))}</button>${gpus().filter(g=>g.w===w.id).map(g=>`<button class="b-device ${focusGpu===g.id?'selected':''}" data-focus="${g.id}" aria-pressed="${focusGpu===g.id}">${I('gpu')}<div><b>${esc(g.name)}</b><small>${gb(g.vram)} · ${staleGpu(g)?'unknown':g.util+'% util'}</small></div>${pair(gpuState(g))}</button>`).join('')}</section>`).join('')}</div><div class="legend">${[['Unallocated','green'],['Allocated','blue'],['Hold / drain','amber'],['Offline / unknown','gray']].map(pair).join('')}</div><p class="note">Select a device to inspect it. Logical registration links, not network topology.</p></div>`;}
function bOverview(){let c=summaryCounts();return `<div class="b-statusbar"><span><b>${c.n}</b> physical GPUs</span><span><b>${live(c.un)}</b> unallocated</span><span><b>${live(c.active)}</b> active workloads</span><span class="${data.holds.length&&!data.stale?'amber':''}"><b>${live(data.holds.length)}</b> known holds</span></div><div class="b-workspace"><section class="b-graph"><div class="b-toolbar"><h2>${I('network')} Compute workspace</h2>${switches()}</div><div class="b-canvas">${topMode==='table'?gpuTable(c.gs):bMap()}</div></section>${bInspector()}</div><div class="b-console"><div><div class="ruler"><h2>Event console</h2>${simple('All events','Events')}</div>${data.events.slice(0,4).map(e=>`<button class="b-log" data-detail="event:${e.id}"><time>${esc(e.age)}</time><span class="${e.color}">${I(e.kind)}</span><span>${esc(e.title)} · ${esc(e.detail)}</span></button>`).join('')||'<p class="note">No recorded activity.</p>'}</div><div><div class="ruler"><h2>Active & queued work</h2>${simple('Jobs','Jobs')}</div>${workTable()}</div></div>`;}
function cRacks(){if(!data.workers.length)return empty('No hardware enrolled','Registered workers will appear here.');return `<div class="c-racks">${data.workers.map((w,i)=>`<section class="c-rack ${w.status==='offline'?'offline':''}"><button class="c-rackhead" data-detail="worker:${w.id}"><b>${I('server')} ${esc(w.name)}</b>${pair(workerState(w))}</button>${gpus().filter(g=>g.w===w.id).map(g=>`<button class="c-slot" data-detail="gpu:${g.id}" style="--state:${byState(gpuState(g))}"><span class="slot-id"><span>GPU ${String(g.index).padStart(2,'0')}</span><span>${gb(g.vram)}</span></span><strong>${esc(g.name)}</strong>${pair(gpuState(g))}<span class="meter-label"><span>VRAM USED</span><span>${staleGpu(g)?'UNKNOWN':g.used.toFixed(1)+' GiB'}</span></span><span class="c-segments" aria-hidden="true">${Array.from({length:16},(_,i)=>`<i class="${!staleGpu(g)&&i<Math.round(pct(g.used,g.vram)*.16)?'on':''}"></i>`).join('')}</span><span class="smallmetrics"><span>LOAD ${staleGpu(g)?'—':g.util+'%'}</span><span>${staleGpu(g)?'—':g.temp+' °C'}</span><span>${staleGpu(g)?'—':g.power+' W'}</span></span></button>`).join('')}${w.gpus.length<2?'<div class="c-unused"><span>NO ADDITIONAL DEVICE REPORTED</span></div>':''}<div class="c-rackfoot"><span>HOST ${String(i+1).padStart(2,'0')}</span><span>${data.stale?'HB UNKNOWN':w.age+'s HB'}</span></div></section>`).join('')}</div><div class="c-legend">${[['Unallocated','green'],['Allocated','blue'],['Hold / drain','amber'],['Offline / unknown','gray']].map(pair).join('')}<span>· Logical inventory, not physical rack placement</span></div>`;}
function cOverview(){let c=summaryCounts();const ins=(a,b,d)=>`<div class="c-instrument"><span class="caption">${a}</span><strong>${b}</strong><small>${d}</small></div>`;return `<div class="c-header">${ins('01 / DEVICE INVENTORY',String(c.n).padStart(2,'0'),`${data.workers.length} hosts · ${live(c.online)} online`)}${ins('02 / UNALLOCATED',live(String(c.un).padStart(2,'0')),'Not an eligibility verdict')}${ins('03 / ACTIVE EXECUTION',live(String(c.active).padStart(2,'0')),`${live(c.queued)} queued jobs`)}${ins('04 / KNOWN JOB HOLDS',live(String(data.holds.length).padStart(2,'0')),data.stale?'State unknown':data.holds.length?'Placement blocked':'No recorded job holds')}</div><div class="c-sectionbar"><h2><span class="section-index">01</span> Device field</h2><div class="ruler"><button class="simple-action" data-detail="control:cp">Control plane ${I('arrow')}</button>${switches()}<button id="treeToggle" class="simple-action" data-tree aria-expanded="${treeOpen}" aria-controls="resourceTree">${I('server')} Resources</button></div></div>${topMode==='table'?gpuTable(c.gs):topMode==='topology'?cTopology():cRacks()}<div class="c-lower">${panel('Execution register','Active batch and streaming work.',workTable(),simple('Jobs','Jobs'))}${panel('Operational log','Most recent simulated events.',eventList(data.events.slice(0,4)),simple('All events','Events'))}</div>`;}
function newOverview(){return design==='A'?aOverview():design==='B'?bOverview():cOverview();}
function tree(){return `<div class="b-tree"><div class="tree-label">RESOURCE TREE</div>${data.workers.map(w=>`<button data-detail="worker:${w.id}">${I('server')} ${esc(w.name)}</button>${w.gpus.map(g=>`<button class="child ${g.id===focusGpu?'selected':''}" data-focus="${g.id}" aria-pressed="${g.id===focusGpu}">${I('gpu')}<span>${esc(g.name)}</span></button>`).join('')}`).join('')||'<p class="note">No workers</p>'}</div>`;}
document.addEventListener('click',e=>{let b=e.target.closest('button[data-focus]');if(!b)return;focusGpu=b.dataset.focus;if(page!=='Overview')go('Overview');else render();let replacement=document.querySelector(`.b-device[data-focus="${focusGpu}"]`);replacement?.focus();});

function renderTree(){const t=by('resourceTree');t.hidden=!treeOpen;by('workspaceLayout').classList.toggle('tree-open',treeOpen);if(!treeOpen){t.innerHTML='';return}t.innerHTML=`<div class="tree-head"><h2>Resources</h2><button id="treeClose" data-tree aria-label="Close resource tree">${I('close')}</button></div><button class="tree-root" data-detail="control:cp">${I('network')} Control plane</button>${data.workers.map(w=>`<section class="tree-group"><button data-detail="worker:${w.id}">${I('server')} <strong>${esc(w.name)}</strong>${pair(workerState(w))}</button>${gpus().filter(g=>g.w===w.id).map(g=>`<button class="tree-device" data-detail="gpu:${g.id}">${I('gpu')}<span>${esc(g.name)}</span><span class="dot ${gpuState(g)[1]}" title="${gpuState(g)[0]}"></span></button>`).join('')}</section>`).join('')||'<p class="note">No registered workers.</p>'}`;}
function markSelection(){document.querySelectorAll('#main [data-detail],#resourceTree [data-detail]').forEach(b=>{const on=!!selected&&b.dataset.detail===selected.type+':'+selected.id;b.classList.toggle('cplus-selected',on);if(on)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});}
function cTopology(){if(!data.workers.length)return empty('No hardware enrolled','Registered workers will appear here.');return `<section class="c-topology"><div class="topology-scroll" tabindex="0" aria-label="Scrollable logical topology"><div class="topology-rail"><div class="topology-root"><button data-detail="control:cp">${I('network')}<span><strong>Control plane</strong><small>Registration &amp; allocation</small></span>${pair(data.stale?['Unknown','gray']:['Ready','green'])}</button></div><div class="topology-stem" aria-hidden="true"></div><div class="topology-hosts" style="--hosts:${Math.min(data.workers.length,4)}">${data.workers.map(w=>`<section class="topology-host"><button class="c-rackhead" data-detail="worker:${w.id}"><b>${I('server')} ${esc(w.name)}</b>${pair(workerState(w))}</button>${gpus().filter(g=>g.w===w.id).map(g=>{let a=allocation(g),h=knownHold(g);return `<div class="topology-device"><button data-detail="gpu:${g.id}" style="--state:${byState(gpuState(g))}"><strong>${esc(g.name)}</strong>${pair(gpuState(g))}<small>${gb(g.vram)} · ${staleGpu(g)?'Telemetry unknown':g.util+'% load'}</small></button>${a?`<button class="topology-work" data-detail="${a.id.startsWith('job')?'job':'session'}:${a.id}">${esc(a.project)}<small>${data.stale?'Last known: ':''}${esc(a.status)}</small></button>`:''}${h?`<button class="topology-work held" data-detail="hold:${h.id}">${data.stale?'Last known hold':'Cleanup hold'}${I('arrow')}</button>`:''}</div>`}).join('')}</section>`).join('')}</div></div></div><p class="note">Logical registration and workload assignment links. Not physical network topology. ${data.stale?'Last known relationships; current state unverified.':''}</p></section>`;}
render();
</script></body></html>
