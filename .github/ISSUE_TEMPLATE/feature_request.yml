name: Feature request
description: Propose a focused GPUlink capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Reliability and security impact
      description: Note effects on scheduling, credentials, workers, data, and compatibility.
    validations:
      required: true
