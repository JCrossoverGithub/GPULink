name: CLI preview candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:cli:release -- data/cli-release
      - uses: actions/upload-artifact@v4
        with:
          name: gpulink-cli-candidate-${{ github.sha }}
          path: data/cli-release/*
          if-no-files-found: error
          retention-days: 14
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: gpulink-cli-candidate-${{ github.sha }}
          path: data/cli-release
      - run: npm run test:cli:release -- data/cli-release
