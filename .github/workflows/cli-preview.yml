name: CLI preview candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:cli:release -- data/cli-release
      - uses: actions/upload-artifact@v4
        with:
          name: gpulink-cli-candidate-${{ github.sha }}
          path: data/cli-release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --prefix packages/gpulink-sdk --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix packages/gpulink-sdk
      - run: mkdir -p data/sdk-release
      - run: npm pack ./packages/gpulink-sdk --offline --ignore-scripts --pack-destination data/sdk-release
      - run: npm pack ./packages/gpulink-adapter-sdk --offline --ignore-scripts --pack-destination data/sdk-release
      - run: dotnet pack packages/gpulink-dotnet/GPULink.Client/GPULink.Client.csproj --configuration Release --output data/sdk-release -p:ContinuousIntegrationBuild=true
      - run: python scripts/release-candidate.py assemble data/cli-release data/sdk-release data/distribution-candidate --revision "${{ github.sha }}"
      - run: python -m unittest discover -s scripts/acceptance -p test_release_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpulink-distribution-candidate-${{ github.sha }}
          path: data/distribution-candidate/
          if-no-files-found: error
          retention-days: 14
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: gpulink-distribution-candidate-${{ github.sha }}
          path: data/distribution-candidate
      - run: python scripts/release-candidate.py verify data/distribution-candidate --revision "${{ github.sha }}"
      - run: npm run test:cli:release -- data/distribution-candidate/cli
      - run: npm run test:sdk:release -- data/distribution-candidate
      - run: python scripts/acceptance/dotnet-release-install.py data/distribution-candidate
  release-delivery:
    needs: [build, install]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: gpulink-distribution-candidate-${{ github.sha }}
          path: data/distribution-candidate
      - run: python scripts/release-candidate.py stage data/distribution-candidate data/release-delivery --revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gpulink-release-delivery-${{ github.sha }}
          path: data/release-delivery/*
          if-no-files-found: error
          retention-days: 14
