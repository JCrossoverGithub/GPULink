name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - if: runner.os == 'Linux'
        run: docker build -f deploy/digitalocean/Dockerfile -t gpulink-control-plane:test .

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements.txt
      - run: python -m pip install -r dashboard/backend/requirements.txt
      - run: python -m unittest discover -s dashboard/backend/tests
        env:
          PYTHONPATH: dashboard/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
