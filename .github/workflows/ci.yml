name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/gpulink-sdk --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix packages/gpulink-sdk
      - run: npm test --prefix packages/gpulink-sdk
      - run: npm run check
      - if: runner.os == 'Linux'
        run: docker build -f deploy/digitalocean/Dockerfile -t gpulink-control-plane:test .

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements.txt
      - run: python -m pip install -r dashboard/backend/requirements.txt
      - run: python -m unittest discover -s dashboard/backend/tests
        env:
          PYTHONPATH: dashboard/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend

  dotnet-client-sdk:
    name: .NET client SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run .NET SDK contract checks
        run: dotnet run --project packages/gpulink-dotnet/GPULink.Client.ContractTests/GPULink.Client.ContractTests.csproj --configuration Release
      - name: Build .NET NuGet package
        run: dotnet pack packages/gpulink-dotnet/GPULink.Client/GPULink.Client.csproj --configuration Release --output artifacts/nuget -p:ContinuousIntegrationBuild=true
      - name: Validate package contents and metadata
        run: python packages/gpulink-dotnet/verify-package.py artifacts/nuget/GPULink.Client.0.1.0-preview.1.nupkg
      - name: Upload candidate NuGet package (not published)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GPULink.Client-preview-nupkg
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 14
