apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: gpulink
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: gpulink
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: gpulink
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
